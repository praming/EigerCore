services:
  eigercore:
    image: praming/eigercore:latest
    # 需可复现部署时固定为发布版标签，例如 praming/eigercore:1.0.0
    container_name: eigercore
    restart: unless-stopped
    pull_policy: always        # 启动即拉取 Docker Hub 最新镜像，无需 --build 与本地代码
    ports:
      - "5000:5000"
      # 反代（Nginx/宝塔/1Panel）场景下建议仅暴露本机回环：
      # - "127.0.0.1:5000:5000"
    volumes:
      # 全部可变数据（DB / 会话密钥 / 上传图标）均在 /app/instance；备份此卷即可完成迁移/重建
      - eigercore-instance:/app/instance
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  eigercore-instance:
